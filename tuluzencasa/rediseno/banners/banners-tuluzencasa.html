<style id="tlb-css">

  hecho.f=1;
  var ico=function(p){return '<span class="tlb-i"><svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg></span>'};
  var f=el('ul','tlb-franja');f.setAttribute('aria-label','Por qué fiarte de estos datos');
  f.innerHTML=
   '<li>'+ico('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>')+'<span><strong>Fuentes oficiales</strong><small>BOE, UE, CNMC e IDAE</small></span></li>'+
   '<li>'+ico('<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01"/>')+'<span><strong>Cálculos propios</strong><small>Guías publicadas: <span class="tlb-n" data-tlb="guias">–</span></small></span></li>'+
   '<li>'+ico('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>')+'<span><strong>Actualizado</strong><small class="tlb-act">&nbsp;</small></span></li>'+
   '<li>'+ico('<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 9-5.2M16 16l5 5M21 16l-5 5"/>')+'<span><strong>Sin registro</strong><small>Calculadoras gratis: <span class="tlb-n" data-tlb="calcs" data-fin="2">2</span></small></span></li>';
  hero.parentNode.insertBefore(f,hero.nextSibling);
}

/* Inserción en el momento en que el navegador crea cada pieza (antes de pintar) */
function revisar(n){
  if(n.nodeType!==1)return;
  if(!hecho.b&&n.id==='masthead'){esHome=d.body&&d.body.classList.contains('home');barra(n);if(esHome)cinta(n);else hecho.c=hecho.f=1}
  else if(!hecho.f&&esHome&&n.classList&&n.classList.contains('tl-hero'))franja(n);
}
var mo=W.MutationObserver&&new MutationObserver(function(rs){
  for(var r=0;r<rs.length;r++){var a=rs[r].addedNodes;for(var j=0;j<a.length;j++)revisar(a[j])}
  if(hecho.b&&hecho.c&&hecho.f)mo.disconnect();
});
if(mo&&d.readyState==='loading')mo.observe(h,{childList:true,subtree:true});

function listo(){
  if(mo)mo.disconnect();
  try{if(performance.mark)performance.mark('tlb-ini')}catch(e){}
  var B=d.body,post=B.classList.contains('single-post'),vh=innerHeight;
  function abajo(e,m){return e.getBoundingClientRect().top>vh+(m||0)}

  /* 5b. Cifras de la franja: nº de guías y mes de la última actualización (una petición pequeña, guardada en la sesión) */
  var fr=d.querySelector('.tlb-franja');
  if(fr){
    var pon=function(dat){
      var g=fr.querySelector('[data-tlb="guias"]');if(dat.n){g.setAttribute('data-fin',dat.n);if(RM||!W.IntersectionObserver)g.textContent=dat.n}
      if(dat.m){var M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],f=new Date(dat.m);
        if(!isNaN(f))fr.querySelector('.tlb-act').textContent='en '+M[f.getMonth()]+' de '+f.getFullYear()}
      contar();
    };
    var c=null;try{c=JSON.parse(ss('tlb-datos')||'null')}catch(e){}
    if(c&&Date.now()-c.t<36e5)pon(c);
    else if(W.fetch)fetch('/wp-json/wp/v2/posts?per_page=1&orderby=modified&order=desc&_fields=modified',{credentials:'omit'}).then(function(r){
      var n=+r.headers.get('X-WP-Total');return r.json().then(function(j){var o={n:n||0,m:j&&j[0]&&j[0].modified,t:Date.now()};ss('tlb-datos',JSON.stringify(o));pon(o)})
    }).catch(function(){});
    var contado=0;
    function contar(){
      if(contado||RM||!W.IntersectionObserver)return;
      var io=new IntersectionObserver(function(es){if(!es[0].isIntersecting)return;io.disconnect();contado=1;
        fr.querySelectorAll('.tlb-n[data-fin]').forEach(function(x){var fin=+x.getAttribute('data-fin'),t0=performance.now();
          (function paso(t){var p=Math.min(1,(t-t0)/900),v=Math.round(fin*(1-Math.pow(1-p,3)));x.textContent=v;if(p<1)requestAnimationFrame(paso)})(t0)})
      });io.observe(fr);
    }
  }


  /* 10. Logo: rayo que se enciende al cargar y al pasar el ratón */
  var logo=d.querySelector('.site-header .site-logo'),lim=logo&&logo.querySelector('img');
  if(logo&&lim&&/logo/.test(lim.currentSrc||lim.src)){
    var luz=el('span','tlb-luz','<svg viewBox="54 61 28 47" preserveAspectRatio="none" aria-hidden="true"><path d="M72.5 62.6h.6l-1.3 17h8.3l-4 7.4-12.2 18.6h-.9L66 87H55.8l4.7-7.4z"/></svg>');
    logo.appendChild(luz);
    var enc=function(){luz.classList.add('ini')};
    luz.addEventListener('animationend',function(e){if(e.animationName==='tlb-enciende')luz.classList.remove('ini')});
    if(!RM){if(lim.complete)enc();else lim.addEventListener('load',enc)}
  }
  /* 11. Portada: brillo que recorre la palabra clave del título */
  var h1=!post&&d.querySelector('.home .tl-hero h1');
  if(h1&&!RM){
    var tw=d.createTreeWalker(h1,4),tn;
    while((tn=tw.nextNode())){var m=/(^|\s)(luz|consumo|factura)(?=[\s,.;:!?]|$)/i.exec(tn.data);
      if(m){var ini=m.index+m[1].length,pal=tn.splitText(ini);pal.splitText(m[2].length);var sp=el('span','tlb-clave');sp.setAttribute('data-t',m[2]);pal.parentNode.insertBefore(sp,pal);sp.appendChild(pal);break}}
  }

  if(post){
    var art=d.querySelector('.single-post article'),ec=art&&art.querySelector('.entry-content');
    if(ec){
      /* 3. Tarjeta de calculadora a mitad del artículo, lejos de los huecos de anuncios */
      var cat=(art.className.match(/category-([a-z0-9-]+)/)||[])[1]||'';
      var pot=/^(factura-luz|instalacion)$/.test(cat);
      var hijos=[].slice.call(ec.children),h2=[],faq=-1;
      hijos.forEach(function(x,i){if(x.tagName==='H2'){if(x.id==='preguntas-frecuentes'&&faq<0)faq=i;if(faq<0)h2.push(i)}});
      var cerca=function(i){for(var k=i-3;k<=i+1;k++){var x=hijos[k];if(x&&(x.classList.contains('tl-hueco')||x.tagName==='ASIDE'||x.tagName==='SECTION'))return 1}return 0};
      var obj=Math.floor(h2.length*.6),cand=h2.slice(1).sort(function(a,b){return Math.abs(h2.indexOf(a)-obj)-Math.abs(h2.indexOf(b)-obj)});
      var sitio=null;for(var q=0;q<cand.length;q++){if(!cerca(cand[q])){sitio=hijos[cand[q]];break}}
      if(sitio&&h2.length>=3&&abajo(sitio,150)){
        var t=el('aside','tlb-tarjeta');t.setAttribute('aria-label','Herramienta de tuluzencasa.com');
        t.innerHTML='<span class="tlb-ti">'+RAYO+'</span><p class="tlb-et">Herramienta gratis de tuluzencasa.com</p>'+
          (pot?'<p class="tlb-tt">¿Cuánta potencia necesitas de verdad?</p><p class="tlb-tx">Suma los aparatos que enciendes a la vez y comprueba si te sobra o te falta potencia contratada.</p><a class="tlb-bt" href="'+URL_P+'">'+RAYO+'Calcular mi potencia<span class="tlb-fl" aria-hidden="true">→</span></a>'
              :'<p class="tlb-tt">Calcula lo que te cuesta a ti</p><p class="tlb-tx">Pon tus aparatos, las horas de uso y el precio de tu factura. Sin registro.</p><a class="tlb-bt" href="'+URL_C+'">'+RAYO+'Calcular mi consumo<span class="tlb-fl" aria-hidden="true">→</span></a>');
        sitio.parentNode.insertBefore(t,sitio);
        if(!RM&&W.IntersectionObserver)new IntersectionObserver(function(es){t.classList.toggle('vivo',es[0].isIntersecting)}).observe(t);
      }

      /* 8. Preguntas frecuentes en acordeón (el texto sigue en la página para Google) */
      var fh=ec.querySelector('h2#preguntas-frecuentes');
      if(fh&&abajo(fh,80)){
        var x=fh.nextElementSibling,num=0;
        while(x&&x.tagName==='H3'){
          var h3=x,cuerpo=[],y=h3.nextElementSibling;
          while(y&&/^(P|UL|OL|FIGURE|DIV)$/.test(y.tagName)&&!y.classList.contains('tl-hueco')&&!y.classList.contains('tlb-tarjeta')){cuerpo.push(y);y=y.nextElementSibling}
          if(!cuerpo.length)break;
          if(!y||y.tagName!=='H3')cuerpo=cuerpo.slice(0,1);
          var id='tlb-faq-'+(++num),r=el('div','tlb-faq-r'),inn=el('div');r.id=id;r.appendChild(inn);
          h3.parentNode.insertBefore(r,cuerpo[0]);cuerpo.forEach(function(z){inn.appendChild(z)});
          var bt=el('button','tlb-faq-b');bt.type='button';bt.setAttribute('aria-controls',id);
          while(h3.firstChild)bt.appendChild(h3.firstChild);h3.appendChild(bt);h3.classList.add('tlb-faq-h');
          var abre=num===1;bt.setAttribute('aria-expanded',abre);if(abre)r.classList.add('on');
          bt.addEventListener('click',function(){var e=this.getAttribute('aria-expanded')==='true';this.setAttribute('aria-expanded',!e);d.getElementById(this.getAttribute('aria-controls')).classList.toggle('on',!e)});
          x=y;
        }
      }

      /* 4. Botón fijo «Calcular mi consumo» desde la mitad del artículo */
      var fijo=el('a','tlb-fijo',RAYO+'Calcular mi consumo');fijo.href=URL_C;B.appendChild(fijo);
      if(MOVIL)B.style.paddingBottom='48px';
      var tapa=0,vistos=new Set();
      if(W.IntersectionObserver){
        var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)vistos.add(e.target);else vistos.delete(e.target)});tapa=vistos.size;mover()});
        d.querySelectorAll('.tl-hueco,ins.adsbygoogle,.tlb-tarjeta,.tl-autor,.tl-rel,.site-footer').forEach(function(z){io2.observe(z)});
        setInterval(function(){d.querySelectorAll('ins.adsbygoogle:not([data-tlb])').forEach(function(z){z.setAttribute('data-tlb','1');io2.observe(z)})},2000);
      }
    }
  }

  /* 9. Volver arriba */
  var up=el('button','tlb-arriba',RAYO.replace('M13 2 4 14h7l-1 8 9-12h-7l1-8z','M12 3 5 11h4v10h6V11h4z'));up.type='button';up.setAttribute('aria-label','Volver arriba');B.appendChild(up);
  up.addEventListener('click',function(){scrollTo({top:0,behavior:RM?'auto':'smooth'})});

  var pend=0;
  function mover(){
    var y=scrollY;h.classList.toggle('tlb-arriba-on',y>vh*1.5);
    if(fijo){
      var mid=ec.getBoundingClientRect().top+y+ec.offsetHeight/2;
      var ancla=!!d.querySelector('ins.adsbygoogle[data-anchor-status="displayed"],ins.adsbygoogle[data-anchor-shown="true"]');
      h.classList.toggle('tlb-fijo-on',y+vh>mid&&!tapa&&!(MOVIL&&ancla));
    }
  }
  addEventListener('scroll',function(){if(!pend){pend=1;requestAnimationFrame(function(){pend=0;mover()})}},{passive:true});
  addEventListener('resize',function(){vh=innerHeight;mover()},{passive:true});
  mover();

  /* 7. Aparición suave al hacer scroll (solo lo que aún no se ve) */
  if(!RM&&W.IntersectionObserver){
    var sel=post?'.entry-content>h2,.entry-content>figure,.entry-content>.wp-block-table,.entry-content>.tl-dato,.entry-content>.tlb-tarjeta,.tl-autor,.tl-rel'
                :'.tl-home .tl-sec,.tl-home .tl-calcs,.tl-home .tl-cats,.tl-home .tl-ultimos,.tl-home .tl-guias,.tlb-franja';
    var io3=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('tlb-visto');e.target.classList.remove('tlb-oculto');io3.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px'});
    d.querySelectorAll(sel).forEach(function(z){if(abajo(z)){z.classList.add('tlb-oculto');io3.observe(z)}});
  }
  try{if(performance.mark)performance.mark('tlb-fin')}catch(e){}
}
if(d.readyState==='loading')d.addEventListener('DOMContentLoaded',listo);else listo();
})();
</script>
