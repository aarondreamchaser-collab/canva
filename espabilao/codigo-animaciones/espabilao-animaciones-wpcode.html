<!--
  ESPABILAO · Animaciones (para pegar en WPCode > Fragmento HTML > Pie de página)
  Requiere el tema Espabilao 3.0. No usa librerías externas.
  Se desactiva solo para quien tenga activado «reducir movimiento» en su dispositivo.
-->
<style id="espabilao-animaciones">
/* ======================================================================
   v3.1 · Movimiento (solo con html.movimiento; nunca con «reducir movimiento»)
   ====================================================================== */
@keyframes esp-aparecer{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes esp-desplegar{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes esp-sello{0%{opacity:0;transform:scale(1.9) rotate(-14deg)}55%{opacity:1;transform:scale(.92) rotate(2deg)}75%{transform:scale(1.04) rotate(-1deg)}100%{opacity:1;transform:none}}
@keyframes esp-subrayar{from{background-size:0 100%}to{background-size:100% 100%}}
@keyframes esp-flotar-a{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,30px) scale(1.08)}}
@keyframes esp-flotar-b{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-20px) scale(.94)}}
@keyframes esp-alerta{0%,100%{transform:rotate(-7deg)}20%{transform:rotate(9deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-8deg)}}
@keyframes esp-pulso{0%{box-shadow:0 0 0 0 rgba(255,106,43,.45)}100%{box-shadow:0 0 0 14px rgba(255,106,43,0)}}
@keyframes esp-crecer{from{transform:scaleX(0)}to{transform:scaleX(1)}}

@media (prefers-reduced-motion:no-preference){
	/* Aparición al desplazarse */
	.movimiento .revelar{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--retraso,0ms)}
	.movimiento .revelar.es-visible{opacity:1;transform:none}

	/* Sellos de veredicto */
	.movimiento .sello-espera{opacity:0}
	.movimiento .sello-espera.es-visible{animation:esp-sello .65s cubic-bezier(.3,1.4,.5,1) .15s both}

	/* Iconos que se dibujan */
	.movimiento .dibujar>*{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.6,.1,.2,1) .1s}
	.movimiento .dibujar.es-visible>*{stroke-dashoffset:0}
	.movimiento .dibujar>[fill="currentColor"]{transition:opacity .6s .8s;opacity:0}
	.movimiento .dibujar.es-visible>[fill="currentColor"]{opacity:1}

	/* Marcador: los tramos crecen */
	.movimiento .marcador .marcador__tramo,.movimiento .dato--ancho .marcador__tramo{transform:scaleX(0);transform-origin:0 50%}
	.movimiento .marcador.es-visible .marcador__tramo,.movimiento .dato--ancho.es-visible .marcador__tramo{animation:esp-crecer .9s cubic-bezier(.2,.7,.2,1) both}
	.movimiento .marcador.es-visible .marcador__tramo:nth-child(2),.movimiento .dato--ancho.es-visible .marcador__tramo:nth-child(2){animation-delay:.15s}
	.movimiento .marcador.es-visible .marcador__tramo:nth-child(3),.movimiento .dato--ancho.es-visible .marcador__tramo:nth-child(3){animation-delay:.3s}

	/* Hero: subrayado que se pinta y manchas de color que flotan */
	.movimiento .hero{position:relative;overflow:hidden}
	.movimiento .hero::before,.movimiento .hero::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;z-index:0}
	.movimiento .hero::before{width:420px;height:420px;right:-80px;top:-120px;background:rgba(255,106,43,.45);animation:esp-flotar-a 18s ease-in-out infinite}
	.movimiento .hero::after{width:360px;height:360px;left:-120px;bottom:-160px;background:rgba(90,62,194,.22);animation:esp-flotar-b 22s ease-in-out infinite}
	.movimiento .hero>*{position:relative;z-index:1}
	.movimiento .hero__titulo mark{background-color:transparent;background-image:linear-gradient(var(--naranja),var(--naranja));background-repeat:no-repeat;background-size:100% 100%;animation:esp-subrayar .9s cubic-bezier(.6,.1,.2,1) .25s both}
	.movimiento .logo__icono{animation:esp-alerta .9s ease-in-out .6s 1 both}

	/* Cabecera inteligente */
	.movimiento .cabecera{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
	.movimiento .cabecera.is-scroll{box-shadow:0 6px 24px rgba(26,26,31,.07)}
	.movimiento .cabecera.is-oculta{transform:translateY(-100%)}

	/* Paneles que se despliegan */
	.movimiento .mega.is-abierto .mega__panel,.movimiento .mega:focus-within .mega__panel,.movimiento .desplegable[open] .desplegable__panel{animation:esp-desplegar .22s cubic-bezier(.2,.7,.2,1) both}
	.movimiento .glosa__def:not([hidden]){animation:esp-desplegar .18s ease-out both}
	.movimiento .faq__item[open] p{animation:esp-aparecer .3s ease-out both}

	/* Resultados de las herramientas en cascada */
	.movimiento .hito,.movimiento .detector__item,.movimiento .cifra{animation:esp-aparecer .45s cubic-bezier(.2,.7,.2,1) both}
	.movimiento .hito:nth-child(2),.movimiento .detector__item:nth-child(2),.movimiento .cifra:nth-child(2){animation-delay:.07s}
	.movimiento .hito:nth-child(3),.movimiento .detector__item:nth-child(3),.movimiento .cifra:nth-child(3){animation-delay:.14s}
	.movimiento .hito:nth-child(4),.movimiento .detector__item:nth-child(4){animation-delay:.21s}
	.movimiento .hito:nth-child(n+5),.movimiento .detector__item:nth-child(n+5){animation-delay:.28s}
	.movimiento .barra-proporcion span{animation:esp-crecer .8s cubic-bezier(.2,.7,.2,1) .2s both;transform-origin:0 50%}
	.movimiento .marca{transition:background-color .3s}
	.movimiento .hito--pronto .hito__estado,.movimiento .hito--hoy .hito__estado{animation:esp-pulso 1.6s ease-out 3}

	/* Foco de luz que sigue al ratón */
	.movimiento .con-foco{position:relative;isolation:isolate}
	.movimiento .con-foco::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,106,43,.16),transparent 65%);opacity:0;transition:opacity .25s;pointer-events:none;z-index:2}
	.movimiento .con-foco:hover::before{opacity:1}

	/* Efecto 3D */
	.movimiento .con-3d{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;will-change:transform}
	@media (min-width:1000px){.movimiento .caso-destacado.con-3d{transform:perspective(900px) rotate(1.2deg) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}}

	/* Botones magnéticos */
	.movimiento .magnetico{transform:translate(var(--tx,0px),var(--ty,0px));transition:transform .2s ease-out,background .15s}

	/* Micro-interacciones */
	.movimiento .tipos--rejilla a:hover .tipos__icono,.movimiento .herramienta-tarjeta a:hover .herramienta-tarjeta__icono,.movimiento .seccion a:hover .seccion__icono{transform:rotate(-8deg) scale(1.08)}
	.movimiento .tipos__icono,.movimiento .herramienta-tarjeta__icono,.movimiento .seccion__icono{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
	.movimiento .tarjeta:hover .imagen--vacia .icono{transform:scale(1.15) rotate(-6deg)}
	.movimiento .imagen--vacia .icono{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
	.movimiento .enlace-mas .icono,.movimiento .herramienta-tarjeta__ir .icono{transition:transform .2s}
	.movimiento .enlace-mas:hover .icono,.movimiento .herramienta-tarjeta a:hover .herramienta-tarjeta__ir .icono{transform:translateX(4px)}
	.movimiento .nube a{transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
	.movimiento .nube a:hover{transform:translateY(-3px) rotate(-2deg)}
	.movimiento .boton-copiar.is-copiado{animation:esp-sello .45s both}

	/* Transición entre páginas (navegadores compatibles) */
	@view-transition{navigation:auto}
	::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
}

/* Volver arriba con anillo de progreso (lo crea el JavaScript) */
.volver-arriba{position:fixed;right:16px;bottom:88px;z-index:60;width:48px;height:48px;border-radius:50%;border:0;padding:2px;background:#fff;color:var(--tinta);box-shadow:var(--sombra-alta);cursor:pointer;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s,transform .25s}
.volver-arriba.is-visible{opacity:1;transform:none;pointer-events:auto}
.volver-arriba svg{display:block}
.volver-arriba__pista{fill:none;stroke:var(--linea);stroke-width:3}
.volver-arriba__anillo{fill:none;stroke:var(--naranja);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;transform:rotate(-90deg);transform-origin:50% 50%;stroke-linecap:round}
.volver-arriba:hover{color:var(--naranja-osc)}
@media (min-width:1000px){.volver-arriba{right:24px;bottom:24px}}
@media print{.volver-arriba{display:none}}

</style>
<script id="espabilao-animaciones-js">
/**
 * Espabilao · capa de movimiento.
 * Sin librerías. Se apaga sola con «reducir movimiento» y nunca oculta
 * contenido si el JavaScript falla: las clases se añaden desde aquí.
 */
( function () {
	'use strict';

	var html = document.documentElement;
	var reducir = window.matchMedia( '(prefers-reduced-motion: reduce)' ).matches;
	var punteroFino = window.matchMedia( '(hover: hover) and (pointer: fine)' ).matches;

	// Evita que se ejecute dos veces (por ejemplo, si el tema ya trae las animaciones).
	if ( window.espabilaoMovimientoActivo || document.querySelector( 'script[src*="movimiento.js"]' ) ) {
		return;
	}
	window.espabilaoMovimientoActivo = true;

	if ( reducir ) {
		html.classList.remove( 'movimiento' );
		return;
	}
	html.classList.add( 'movimiento' );

	function todos( sel, ctx ) {
		return Array.prototype.slice.call( ( ctx || document ).querySelectorAll( sel ) );
	}

	/* 1. Aparición al desplazarse, escalonada por grupos ------------- */
	var GRUPOS = [
		'.bloque__cabecera', '.garantias > li', '.herramientas-rejilla > li', '.tipos--rejilla > li',
		'.secciones > li', '.tarjetas > .tarjeta', '.marcador', '.lista > .fila', '.lateral > .caja',
		'.banda-reclamar__texto', '.mini-escalera > li', '.faq__item', '.nube > li', '.hub__datos > .dato',
		'.hub__saltos > a', '.plazos__lista > .plazo', '.escalera__pasos > .peldano', '.esp-carta', '.esp-poliza',
		'.autor', '.fuentes', '.ficha-caso__dato', '.e404__salidas', '.pie__mapa > nav', '.archivo__cabecera',
		'.relacionados .bloque__cabecera'
	];
	var alto = window.innerHeight;
	var revelables = [];
	todos( GRUPOS.join( ',' ) ).forEach( function ( el ) {
		// Lo que ya se ve al cargar no se anima (no retrasa la primera pintura).
		if ( el.getBoundingClientRect().top < alto * 0.92 ) {
			return;
		}
		var hermanos = el.parentNode ? Array.prototype.indexOf.call( el.parentNode.children, el ) : 0;
		el.style.setProperty( '--retraso', ( Math.max( 0, hermanos ) % 6 ) * 70 + 'ms' );
		el.classList.add( 'revelar' );
		revelables.push( el );
	} );

	/* 2. Sellos de veredicto que «golpean» al aparecer --------------- */
	var sellos = todos( '.veredicto--grande, .veredicto--flotante, .ficha-caso .veredicto' );
	sellos.forEach( function ( s ) {
		s.classList.add( 'sello-espera' );
	} );

	/* 3. Iconos que se dibujan solos ---------------------------------- */
	var iconos = todos( '.tipos--rejilla .tipos__icono svg, .herramienta-tarjeta__icono svg, .seccion__icono svg, .hub__icono svg, .garantias svg' );
	iconos.forEach( function ( svg ) {
		todos( 'path, circle, rect, line, polyline', svg ).forEach( function ( forma ) {
			forma.setAttribute( 'pathLength', '1' );
		} );
		svg.classList.add( 'dibujar' );
	} );

	/* 4. Contadores que suben ----------------------------------------- */
	var contadores = todos( '.dato strong, .seccion__n, .tipos__n' ).filter( function ( el ) {
		return /\d/.test( el.textContent ) && el.getBoundingClientRect().top > alto;
	} );
	// Reservar el ancho final antes de contar (fuera de pantalla) para que nada se mueva.
	contadores.forEach( function ( el ) {
		if ( 'inline' === window.getComputedStyle( el ).display ) {
			el.style.display = 'inline-block';
		}
		el.style.minWidth = el.getBoundingClientRect().width + 'px';
	} );
	function contar( el ) {
		var nodo = null;
		// Solo el primer nodo de texto con número (respeta iconos y textos ocultos).
		var paseo = document.createTreeWalker( el, NodeFilter.SHOW_TEXT );
		while ( paseo.nextNode() ) {
			if ( /\d/.test( paseo.currentNode.nodeValue ) ) {
				nodo = paseo.currentNode;
				break;
			}
		}
		if ( ! nodo ) {
			return;
		}
		var original = nodo.nodeValue;
		var m = original.match( /\d+/ );
		var fin = parseInt( m[ 0 ], 10 );
		if ( ! fin ) {
			return;
		}
		var inicio = null;
		var paso = function ( t ) {
			if ( null === inicio ) {
				inicio = t;
			}
			var p = Math.min( 1, ( t - inicio ) / 900 );
			var suave = 1 - Math.pow( 1 - p, 3 );
			nodo.nodeValue = original.replace( m[ 0 ], String( Math.round( fin * suave ) ) );
			if ( p < 1 ) {
				window.requestAnimationFrame( paso );
			} else {
				nodo.nodeValue = original;
			}
		};
		window.requestAnimationFrame( paso );
	}

	/* Observador común ------------------------------------------------- */
	var objetivos = revelables.concat( sellos, iconos, contadores, todos( '.marcador, .dato--ancho' ) );
	if ( 'IntersectionObserver' in window ) {
		var obs = new IntersectionObserver( function ( entradas ) {
			entradas.forEach( function ( e ) {
				if ( ! e.isIntersecting ) {
					return;
				}
				var el = e.target;
				el.classList.add( 'es-visible' );
				if ( contadores.indexOf( el ) > -1 ) {
					contar( el );
				}
				obs.unobserve( el );
			} );
		}, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 } );
		objetivos.forEach( function ( el ) {
			obs.observe( el );
		} );
	} else {
		objetivos.forEach( function ( el ) {
			el.classList.add( 'es-visible' );
		} );
	}

	/* 5. Cabecera inteligente: se esconde al bajar y vuelve al subir --- */
	var cabecera = document.querySelector( '.cabecera' );
	if ( cabecera ) {
		var ultimo = window.scrollY;
		var pendiente = false;
		var revisar = function () {
			pendiente = false;
			var y = window.scrollY;
			var abierto = document.querySelector( '.desplegable[open], .mega.is-abierto' );
			cabecera.classList.toggle( 'is-scroll', y > 8 );
			if ( ! abierto && y > 420 && y > ultimo + 6 ) {
				cabecera.classList.add( 'is-oculta' );
			} else if ( y < ultimo - 6 || y < 420 ) {
				cabecera.classList.remove( 'is-oculta' );
			}
			ultimo = y;
		};
		window.addEventListener( 'scroll', function () {
			if ( ! pendiente ) {
				pendiente = true;
				window.requestAnimationFrame( revisar );
			}
		}, { passive: true } );
		cabecera.addEventListener( 'focusin', function () {
			cabecera.classList.remove( 'is-oculta' );
		} );
	}

	/* 6. Foco de luz que sigue al ratón en las tarjetas ----------------- */
	if ( punteroFino ) {
		todos( '.herramienta-tarjeta a, .tipos--rejilla a, .seccion a, .tarjeta, .caja--crema' ).forEach( function ( el ) {
			el.classList.add( 'con-foco' );
			el.addEventListener( 'pointermove', function ( e ) {
				var r = el.getBoundingClientRect();
				el.style.setProperty( '--mx', ( e.clientX - r.left ) + 'px' );
				el.style.setProperty( '--my', ( e.clientY - r.top ) + 'px' );
			} );
		} );

		/* 7. Efecto 3D en el caso destacado y la tarjeta de 404 --------- */
		todos( '.caso-destacado, .e404__poliza' ).forEach( function ( el ) {
			el.classList.add( 'con-3d' );
			el.addEventListener( 'pointermove', function ( e ) {
				var r = el.getBoundingClientRect();
				var x = ( e.clientX - r.left ) / r.width - 0.5;
				var y = ( e.clientY - r.top ) / r.height - 0.5;
				el.style.setProperty( '--rx', ( -y * 7 ).toFixed( 2 ) + 'deg' );
				el.style.setProperty( '--ry', ( x * 9 ).toFixed( 2 ) + 'deg' );
			} );
			el.addEventListener( 'pointerleave', function () {
				el.style.setProperty( '--rx', '0deg' );
				el.style.setProperty( '--ry', '0deg' );
			} );
		} );

		/* 8. Botones magnéticos ------------------------------------------ */
		todos( '.boton--naranja, .buscador__boton' ).forEach( function ( b ) {
			b.classList.add( 'magnetico' );
			b.addEventListener( 'pointermove', function ( e ) {
				var r = b.getBoundingClientRect();
				b.style.setProperty( '--tx', ( ( e.clientX - r.left - r.width / 2 ) * 0.18 ).toFixed( 1 ) + 'px' );
				b.style.setProperty( '--ty', ( ( e.clientY - r.top - r.height / 2 ) * 0.25 ).toFixed( 1 ) + 'px' );
			} );
			b.addEventListener( 'pointerleave', function () {
				b.style.setProperty( '--tx', '0px' );
				b.style.setProperty( '--ty', '0px' );
			} );
		} );
	}

	/* 9. Buscador de portada que escribe preguntas solo ----------------- */
	var campo = document.querySelector( '.hero__buscador .buscador__campo' );
	// Edita aquí las preguntas que se escriben solas en el buscador de la portada.
	var preguntas = window.espabilaoPreguntas || [
		'¿Me cubre una gotera del vecino?',
		'¿Me pagan la luna rota del coche?',
		'¿Qué es la franquicia?',
		'¿Cómo no renuevo mi seguro?',
		'¿Cubre la baja médica?'
	];
	if ( campo && preguntas.length ) {
		var original = campo.getAttribute( 'placeholder' );
		var i = 0;
		var letra = 0;
		var borrando = false;
		var parado = false;
		var temporizador = null;
		var escribir = function () {
			if ( parado ) {
				return;
			}
			var frase = preguntas[ i % preguntas.length ];
			if ( ! borrando ) {
				letra++;
				campo.setAttribute( 'placeholder', frase.slice( 0, letra ) );
				if ( letra >= frase.length ) {
					borrando = true;
					temporizador = setTimeout( escribir, 1800 );
					return;
				}
				temporizador = setTimeout( escribir, 45 + Math.random() * 45 );
			} else {
				letra--;
				campo.setAttribute( 'placeholder', frase.slice( 0, letra ) );
				if ( letra <= 0 ) {
					borrando = false;
					i++;
					temporizador = setTimeout( escribir, 350 );
					return;
				}
				temporizador = setTimeout( escribir, 22 );
			}
		};
		var parar = function () {
			parado = true;
			clearTimeout( temporizador );
			campo.setAttribute( 'placeholder', original );
		};
		campo.addEventListener( 'focus', parar );
		campo.addEventListener( 'input', parar );
		// La primera pregunta empieza cuando la página ya está pintada.
		temporizador = setTimeout( escribir, 1400 );
		document.addEventListener( 'visibilitychange', function () {
			if ( document.hidden ) {
				clearTimeout( temporizador );
			} else if ( ! parado ) {
				temporizador = setTimeout( escribir, 600 );
			}
		} );
	}

	/* 10. Botón «volver arriba» con anillo de progreso --------------------- */
	var arriba = document.createElement( 'button' );
	arriba.type = 'button';
	arriba.className = 'volver-arriba';
	arriba.setAttribute( 'aria-label', 'Volver arriba' );
	arriba.innerHTML = '<svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true"><circle class="volver-arriba__pista" cx="22" cy="22" r="19"/><circle class="volver-arriba__anillo" cx="22" cy="22" r="19" pathLength="1"/><path d="M22 28V16M16.5 21.5 22 16l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
	document.body.appendChild( arriba );
	var anillo = arriba.querySelector( '.volver-arriba__anillo' );
	var medir = function () {
		var max = document.documentElement.scrollHeight - window.innerHeight;
		var p = max > 0 ? window.scrollY / max : 0;
		anillo.style.strokeDashoffset = String( 1 - p );
		arriba.classList.toggle( 'is-visible', window.scrollY > window.innerHeight * 1.2 );
	};
	window.addEventListener( 'scroll', function () {
		window.requestAnimationFrame( medir );
	}, { passive: true } );
	arriba.addEventListener( 'click', function () {
		window.scrollTo( { top: 0, behavior: 'smooth' } );
	} );
	medir();
}() );

</script>
